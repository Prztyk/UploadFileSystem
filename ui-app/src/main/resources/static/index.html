<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<h1>File Upload System</h1>

<nav class="menu">
    <button data-section="uploadSection">Upload</button>
    <button data-section="historySection">Upload history</button>
    <button data-section="detailsSection">File details</button>
    <button data-section="searchSection">Semantic search</button>
</nav>

<section id="uploadSection" class="page-section">
    <h2>Upload file</h2>

    <form id="uploadForm">
        <input type="file" id="fileInput" required>
        <button type="submit">Upload</button>
    </form>

    <p id="uploadMessage"></p>
</section>

<section id="historySection" class="page-section hidden">
    <h2>Upload history</h2>

    <button id="refreshHistoryButton">Refresh history</button>

    <table id="historyTable" border="1" cellpadding="6">
        <thead>
        <tr>
            <th>ID</th>
            <th>Original filename</th>
            <th>Content type</th>
            <th>Size</th>
            <th>Status</th>
            <th>Created at</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<section id="detailsSection" class="page-section hidden">
    <h2>File details</h2>
    <div id="fileDetails">
        <p>Select a file from upload history.</p>
    </div>
</section>

<section id="searchSection" class="page-section hidden">
    <h2>Semantic search</h2>

    <form id="searchForm">
        <input
                type="text"
                id="searchQuery"
                placeholder="Search in uploaded documents..."
                required
        >

        <input
                type="number"
                id="searchLimit"
                value="5"
                min="1"
                max="20"
        >

        <input
                type="number"
                id="minSimilarity"
                value="0"
                min="-1"
                max="1"
                step="0.01"
        >

        <button type="submit">Search</button>
    </form>

    <div id="searchResults"></div>
</section>

<script src="/js/api.js"></script>
<script src="/js/navigation.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/history.js"></script>
<script src="/js/details.js"></script>
<script src="/js/search.js"></script>
<script src="/js/main.js"></script>

</body>
</html>
