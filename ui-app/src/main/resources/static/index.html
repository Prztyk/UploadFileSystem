<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Search Upload</title>
</head>
<body>
<h1>Upload file</h1>

<form id="uploadForm">
    <input type="file" name="file" required>
    <button type="submit">Upload</button>
</form>

<p id="result"></p>

<h2>Upload history</h2>
<button onclick="loadHistory()">Refresh history</button>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Original filename</th>
        <th>Stored filename</th>
        <th>Content type</th>
        <th>Size</th>
        <th>Status</th>
        <th>Created at</th>
        <th>Chunks</th>
    </tr>
    </thead>
    <tbody id="historyBody"></tbody>
</table>

<h2>Chunks</h2>
<div id="chunks"></div>

<h2>Semantic search</h2>

<form id="searchForm">
    <input
            type="text"
            id="searchQuery"
            placeholder="Search in uploaded documents..."
            required
            style="width: 400px;"
    >

    <input
            type="number"
            id="searchLimit"
            value="5"
            min="1"
            max="20"
    >

    <button type="submit">Search</button>
</form>

<div id="searchResults"></div>

<script>
    const form = document.getElementById("uploadForm");
    const result = document.getElementById("result");
    const historyBody = document.getElementById("historyBody");
    const chunksDiv = document.getElementById("chunks");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const formData = new FormData(form);

        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        result.textContent = await response.text();

        await loadHistory();
    });

    async function loadHistory() {
        const response = await fetch("/files/history");
        const files = await response.json();

        historyBody.innerHTML = "";

        for (const file of files) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${file.id}</td>
                <td>${file.originalFilename}</td>
                <td>${file.storedFilename}</td>
                <td>${file.contentType}</td>
                <td>${file.size}</td>
                <td>${file.status}</td>
                <td>${file.createdAt}</td>
                <td>
                    <button onclick="loadChunks(${file.id})">View chunks</button>
                </td>
            `;

            historyBody.appendChild(row);
        }
    }

    async function loadChunks(fileId) {
        const response = await fetch(`/files/${fileId}/chunks`);
        const chunks = await response.json();

        chunksDiv.innerHTML = "";

        for (const chunk of chunks) {
            const block = document.createElement("pre");
            block.style.border = "1px solid #ccc";
            block.style.padding = "10px";
            block.style.whiteSpace = "pre-wrap";

            block.textContent = `Chunk ${chunk.chunkIndex}\n\n${chunk.content}`;

            chunksDiv.appendChild(block);
        }
    }

    loadHistory();

    const searchForm = document.getElementById("searchForm");
    const searchQuery = document.getElementById("searchQuery");
    const searchLimit = document.getElementById("searchLimit");
    const searchResults = document.getElementById("searchResults");

    searchForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const query = searchQuery.value;
        const limit = searchLimit.value;

        const response = await fetch(
            `/search?query=${encodeURIComponent(query)}&limit=${encodeURIComponent(limit)}`
        );

        const results = await response.json();

        renderSearchResults(results);
    });

    function renderSearchResults(results) {
        searchResults.innerHTML = "";

        if (results.length === 0) {
        searchResults.textContent = "No results found.";
        return;
    }

    const table = document.createElement("table");
    table.border = "1";
    table.cellPadding = "6";

    table.innerHTML = `
            <thead>
            <tr>
                <th>File</th>
                <th>Chunk</th>
                <th>Distance</th>
                <th>Content</th>
            </tr>
            </thead>
            <tbody></tbody>
        `;

        const tbody = table.querySelector("tbody");

        for (const result of results) {
        const row = document.createElement("tr");

        row.innerHTML = `
                <td>${result.originalFilename}</td>
                <td>${result.chunkIndex}</td>
                <td>${result.distance.toFixed(4)}</td>
                <td>
                    <pre style="white-space: pre-wrap; max-width: 700px;">
${result.content}
                    </pre>
                </td>
            `;

        tbody.appendChild(row);
    }

        searchResults.appendChild(table);
    }

</script>
</body>
</html>
