spring.application.name=upload-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/semantic_search
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

ollama.base-url=http://localhost:11434
embedding.model=nomic-embed-text
embedding.dimension=768

answer.model=qwen2.5:7b
answer.max-context-characters-per-result=3000

file-storage.upload-directory=uploads